services:
  - type: web
    name: ai-resume-matcher-api
    runtime: docker
    dockerfilePath: ./Dockerfile.backend
    healthCheckPath: /health
    envVars:
      - key: APP_ENV
        value: production
      - key: DEBUG
        value: false
      - key: OPENAI_API_KEY
        sync: false

  - type: web
    name: ai-resume-matcher-ui
    runtime: docker
    dockerfilePath: ./Dockerfile.frontend
    envVars:
      - key: API_URL
        fromService:
          type: web
          name: ai-resume-matcher-api
          property: hostport
